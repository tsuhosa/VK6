<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#ffb6d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🌸 Vân Khánh Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#4a3b5c;--mu:#a89ab8;
  --pink2:#ffc6dd;--rose:#ff6b9d;
  --lav:#c9b6f0;--mint:#8ed9c0;--honey:#ffd98a;
  --shadow-soft:0 2px 8px rgba(180,140,180,.18);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:600 13.5px/1.35 "Quicksand",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(circle at 8% 12%,rgba(255,200,220,.5) 0 6px,transparent 7px),
    radial-gradient(circle at 88% 22%,rgba(255,220,240,.45) 0 5px,transparent 6px),
    radial-gradient(circle at 22% 78%,rgba(220,190,240,.4) 0 5px,transparent 6px),
    radial-gradient(circle at 78% 88%,rgba(255,200,220,.4) 0 6px,transparent 7px),
    linear-gradient(160deg,#fff5f9 0%,#fdeef8 25%,#f5ecff 55%,#e8f4ff 85%,#e0f0ff 100%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.hide{display:none!important}.mu{color:var(--mu)}.sm{font-size:11px}

#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  gap:7px;padding:calc(env(safe-area-inset-top) + 8px) 9px calc(env(safe-area-inset-bottom) + 8px);
}

#hd{
  position:relative;color:#fff;border-radius:var(--radius);
  padding:14px 12px 9px;
  background:
    radial-gradient(circle at 20% -20%,rgba(255,255,255,.6),transparent 40%),
    linear-gradient(155deg,#ffb3d1 0%,#ff8fb8 40%,#c9b6f0 100%);
  box-shadow:var(--shadow-soft),0 3px 0 rgba(180,140,180,.35);
  overflow:hidden;
}
#hd::before{
  content:"";position:absolute;top:0;left:0;right:0;height:11px;
  background:radial-gradient(circle,rgba(255,255,255,.75) 0 2px,transparent 3px) 0 0/14px 11px;
  border-bottom:1px solid rgba(255,255,255,.5);pointer-events:none;
}
.logo-wrap{
  display:flex;align-items:center;gap:8px;
  position:relative;z-index:1;padding:0 2px;min-width:0;
}
#logo{
  flex:none;width:34px;height:34px;border-radius:50%;object-fit:cover;
  border:2px solid #fff;
  box-shadow:0 2px 4px rgba(150,90,130,.35),0 0 0 2px rgba(255,255,255,.5);
  background:#ffc6dd;
}
.logo-wrap .t{
  flex:1;min-width:0;text-align:left;font-size:13px;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-shadow:0 1px 2px rgba(150,90,130,.35);
  font-family:"Comfortaa","Quicksand",sans-serif;
}
.logo-wrap .t small{display:block;font-size:8px;opacity:.75;letter-spacing:2px;font-weight:600;margin-top:1px;font-family:"Quicksand",sans-serif}
#hd .r{display:flex;align-items:center;gap:5px;margin-top:5px;white-space:nowrap;position:relative;z-index:1}
.stat{
  flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:2px;
  background:rgba(255,255,255,.3);border:1.5px solid rgba(255,255,255,.65);
  border-radius:10px;padding:3px 5px;font-size:11.5px;font-weight:700;
}
.bar{height:6px;border-radius:4px;background:rgba(255,255,255,.4);overflow:hidden}
.bar i{display:block;height:100%;width:0;transition:width .3s}
.bar.hp i{background:linear-gradient(90deg,#ffb3c1,#ff6b9d)}
.bar.lv i{background:linear-gradient(90deg,#c9b6f0,#a890e0)}
.bar-lbl{position:absolute;inset:0;display:grid;place-items:center;font-size:8.5px;color:#fff;text-shadow:0 1px 1px rgba(150,90,130,.6);font-weight:700}
.bar-w{position:relative;margin-top:5px}

.ch1{--w1:#ffe4b8;--w2:#f5b971;--dc:#8a4a2a;--bg:#fff8ee}
.ch2{--w1:#a8c8e8;--w2:#7ec8e3;--dc:#2a4a6a;--bg:#f0f8ff}

#scene{
  position:relative;overflow:hidden;display:flex;flex-direction:column;
  border-radius:var(--radius);
  background:linear-gradient(180deg,var(--w1),var(--w2)) top/100% 30px no-repeat,var(--bg);
  box-shadow:var(--shadow-soft),0 3px 0 rgba(180,140,180,.35);
  min-height:0;
}
#scene::before{
  content:"";position:absolute;top:0;left:0;right:0;height:30px;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.25) 0 6px,transparent 6px 12px);
  pointer-events:none;
}
#top-info{
  position:relative;z-index:1;
  padding:8px 12px 4px;text-align:center;
}
#top-info .date{
  font-family:"Comfortaa",sans-serif;
  font-size:14px;font-weight:700;color:#fff;
  text-shadow:0 2px 4px rgba(150,90,130,.4);
  letter-spacing:.5px;
}
#top-info .weekday{
  font-size:11px;opacity:.85;margin-top:2px;font-weight:700;
  color:#fff;text-shadow:0 1px 2px rgba(150,90,130,.4);
}
#top-info .period{
  display:inline-block;margin-top:5px;
  padding:3px 14px;border-radius:20px;
  background:rgba(255,255,255,.7);
  font-size:12px;font-weight:700;color:var(--dc);
  box-shadow:0 1px 3px rgba(150,90,130,.15);
}
#avatar-w{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;z-index:1;padding:4px 12px;min-height:0;
}
#avatar{
  width:74px;height:74px;border-radius:50%;object-fit:cover;
  border:3px solid #fff;
  box-shadow:0 4px 10px rgba(150,90,130,.3),0 0 0 3px rgba(255,255,255,.5);
  background:#ffc6dd;margin-bottom:6px;
}
#mood{
  font-size:12px;font-weight:700;color:var(--dc);
  text-align:center;padding:3px 12px;
  background:rgba(255,255,255,.55);border-radius:20px;
  max-width:92%;
}
#notice{
  position:relative;z-index:2;
  margin:4px 10px 0;
  padding:6px 10px;border-radius:10px;
  background:linear-gradient(180deg,#fff8e0,#ffeec0);
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.9);
  font-size:11px;color:#8a5a00;font-weight:700;
  display:none;
}
#notice.on{display:block}
#log{
  position:relative;z-index:1;
  margin:4px 10px 6px;
  background:rgba(255,255,255,.55);
  border-radius:10px;padding:5px 9px;
  font-size:11px;color:var(--dc);
  line-height:1.45;max-height:60px;overflow:hidden;min-height:36px;
}
#log .ln{display:block}
#log .ln::before{content:"· ";opacity:.6}

#acts-wrap{
  border-radius:var(--radius);
  background:radial-gradient(circle at 50% 0%,rgba(255,220,235,.4),transparent 60%),#fff;
  box-shadow:var(--shadow-soft),0 3px 0 rgba(180,140,180,.3);
  padding:8px;
}
#period-lbl{
  text-align:center;font-size:11px;color:var(--mu);
  font-weight:700;margin-bottom:6px;letter-spacing:.5px;
}
#acts{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;
}
.act{
  position:relative;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:700;font-size:11px;line-height:1.15;
  height:clamp(58px,7.4vh,72px);
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.9),transparent 70%),linear-gradient(180deg,#fff,#f5f0ff);
  box-shadow:var(--shadow-soft),inset 0 0 0 1.5px rgba(255,255,255,.9);
  color:var(--ink);padding:3px;
}
.act b{font-size:22px;line-height:1.1;margin-bottom:2px;font-weight:400}
.act span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.act small{position:absolute;top:3px;right:6px;font-size:9px;color:var(--mu);font-weight:700}
.act.dis{opacity:.4;filter:grayscale(.7)}
.act.hi{background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.6),transparent 70%),linear-gradient(180deg,#ffc6dd,#ff9bbf);color:#fff}
.act.good{background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.6),transparent 70%),linear-gradient(180deg,#a8e6d0,#7ecbaf);color:#fff}
.act.warn{background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.6),transparent 70%),linear-gradient(180deg,#ffe4a8,#ffd070);color:#8a5a00}
.act.sleep{background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.6),transparent 70%),linear-gradient(180deg,#c9b6f0,#a890e0);color:#fff}
.act.an{background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.6),transparent 70%),linear-gradient(180deg,#ffd1dc,#ffb3c6);color:#8a3a4a}

#nav{
  display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px;
}
#nav button{
  border-radius:11px;font-size:11px;font-weight:700;padding:8px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:radial-gradient(circle at 50% 0%,rgba(255,255,255,.95),transparent 70%),linear-gradient(180deg,#fff,#f5eeff);
  box-shadow:var(--shadow-soft),inset 0 0 0 1.5px rgba(255,255,255,.9);
  color:var(--ink);font-family:"Comfortaa","Quicksand",sans-serif;
}
#nav button b{font-size:17px;line-height:1;font-weight:400}

#sheet{
  position:fixed;inset:0;z-index:50;background:rgba(74,59,92,.45);
  display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.shx{
  width:100%;max-width:480px;max-height:82vh;overflow:auto;
  border-radius:20px 20px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);
  background:linear-gradient(180deg,#fff,#fdf8ff);
  box-shadow:0 -6px 20px rgba(180,140,180,.25);
  animation:sup .28s cubic-bezier(.2,1.3,.5,1);
}
@keyframes sup{from{transform:translateY(100%)}}
.shh{display:flex;align-items:center;font-size:17px;font-weight:700;margin-bottom:8px;padding-bottom:8px;border-bottom:1.5px dashed var(--pink2);font-family:"Comfortaa",sans-serif}
.shh b{flex:1}
h3{margin:14px 0 4px;font-size:14px;font-weight:700;color:var(--rose);display:flex;align-items:center;gap:6px;font-family:"Comfortaa",sans-serif}
h3::before{content:"✿";color:var(--rose);font-size:16px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed #f0e8f5}
.it:last-child{border:0}
.it .m{flex:1;min-width:0}
.it .m b{display:block}
.it small{display:block;color:var(--mu);font-weight:600;margin-top:2px}
.bs{display:flex;gap:5px;flex-wrap:wrap}
.b2{
  border-radius:10px;padding:6px 11px;font-weight:700;font-size:12px;white-space:nowrap;
  background:linear-gradient(180deg,#fff,#f0eaff);
  box-shadow:0 2px 0 rgba(180,140,180,.25),inset 0 0 0 1.5px rgba(255,255,255,.9);
  color:var(--ink);
}
.b2.p{background:linear-gradient(180deg,#ffb3d1,#ff8fb8);color:#fff}
.b2.g{background:linear-gradient(180deg,#a8e6d0,#7ecbaf);color:#fff}
.b2:disabled{opacity:.45}

#modal{
  position:fixed;inset:0;z-index:60;background:rgba(74,59,92,.5);
  display:grid;place-items:center;padding:16px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.bx{
  width:100%;max-width:420px;max-height:88vh;overflow:auto;
  border-radius:22px;padding:20px;
  background:linear-gradient(180deg,#fff,#fdf8ff);
  box-shadow:0 8px 24px rgba(180,140,180,.3);
  animation:pp .3s cubic-bezier(.2,1.3,.5,1);
}
@keyframes pp{from{transform:scale(.88);opacity:0}}
.bx h2{margin:0 0 10px;text-align:center;font-size:19px;color:var(--rose);padding-bottom:8px;border-bottom:1.5px dashed var(--pink2);font-family:"Comfortaa",sans-serif}
.bx .body{font-size:13px;line-height:1.55}
.bx .body b{color:var(--rose)}
.ev{background:linear-gradient(180deg,#fff8e0,#ffeec0);border-radius:12px;padding:9px 12px;margin:8px 0;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.8)}
.g2{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px}
.mb{display:grid;gap:9px;margin-top:14px}
.mb2{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.sp{display:flex;justify-content:center;margin:8px 0 4px}
.sp img{width:80px;height:80px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 4px 12px rgba(180,120,150,.35);background:#ffc6dd}

#toast{position:fixed;left:50%;top:22%;transform:translateX(-50%);z-index:70;display:grid;gap:6px;width:min(92vw,420px);pointer-events:none}
#toast div{
  background:linear-gradient(180deg,#ffb3d1,#ff8fb8);color:#fff;
  border:2px solid #fff;border-radius:14px;
  padding:7px 14px;text-align:center;font-weight:700;font-size:12.5px;
  box-shadow:0 4px 10px rgba(200,120,160,.3);
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body class="ch1">
<div id="app">
  <header id="hd">
    <div class="logo-wrap">
      <img id="logo" src="icon-192.png" alt="Vân Khánh">
      <div class="t">Vân Khánh Diary<small id="chapLbl">✿ THẠC SĨ · CNU BẮC KINH ✿</small></div>
    </div>
    <div class="r">
      <span class="stat">⚡<b id="hpV">80</b></span>
      <span class="stat">💗<b id="spV">70</b></span>
      <span class="stat">💰<b id="moneyV">500</b></span>
      <span class="stat">📚<b id="ktV">5</b></span>
    </div>
    <div class="bar-w bar hp"><i id="hpB"></i><span class="bar-lbl" id="hpLbl"></span></div>
    <div class="bar-w bar lv"><i id="lvB"></i><span class="bar-lbl" id="lvLbl"></span></div>
  </header>

  <section id="scene">
    <div id="top-info">
      <div class="date" id="dateV">Ngày 1 · Tuần 1</div>
      <div class="weekday" id="weekV">Thứ Hai</div>
      <div class="period" id="periodV">🌅 Buổi sáng</div>
    </div>
    <div id="avatar-w">
      <img id="avatar" src="icon-192.png" alt="Vân Khánh">
      <div id="mood">Vân Khánh đang chuẩn bị cho ngày mới.</div>
    </div>
    <div id="notice"></div>
    <div id="log"><span class="ln" style="opacity:.6">Nhật ký sẽ ghi lại ở đây...</span></div>
  </section>

  <div id="acts-wrap">
    <div id="period-lbl">Chọn 1 hành động cho buổi sáng</div>
    <div id="acts"></div>
    <nav id="nav">
      <button data-a="log"><b>📖</b>Nhật ký</button>
      <button data-a="record"><b>🏆</b>Kỷ lục</button>
      <button data-a="home"><b>🏠</b>Về nhà</button>
    </nav>
  </div>
</div>

<div id="sheet" class="hide"><div class="shx"><div class="shh"><b id="sht"></b><button class="b2" data-a="closeSheet">✕</button></div><div id="shb"></div></div></div>
<div id="modal" class="hide"></div>
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const F=n=>Math.round(n).toLocaleString('vi-VN');

const KEY='vkdiary_v4';
const SLOT='vkdiary_slot_v4';
const REC_KEY='vkdiary_rec_v4';
const SAVE_VER=4;
const RENT=1000;
const SCHOLAR=[0,2500,3500];
const START_MONEY=500;

const WD=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
const PERIODS=['🌅 Buổi sáng','☀️ Buổi chiều','🌙 Buổi tối'];

/* ===== HÀNH ĐỘNG ===== */
/* p: 0=sáng, 1=chiều, 2=tối
   grp: an | hoc | lam | viet | choi | ngu | y
   once: 1 lần/ngày
   fixed: bắt buộc (chỉ Ngủ tối)
*/
const ACTS=[
  /* 🌅 SÁNG */
  {k:'s_an', n:'Ăn sáng',        e:'🍚', p:0, hp:8,   sp:3,   m:-5,  grp:'an',  once:1},
  {k:'s_tv', n:'Đi thư viện',    e:'📚', p:0, hp:-6,  sp:-12, kt:18, grp:'hoc'},
  {k:'s_tt', n:'Học tiếng Trung',e:'🀄', p:0, hp:-4,  sp:-8,  kt:6,  grp:'hoc'},
  {k:'s_ts', n:'Pha trà sữa',    e:'🧋', p:0, hp:-8,  sp:-10, m:45,  grp:'lam'},
  {k:'s_ng', n:'Ngủ nướng',      e:'😴', p:0, hp:10,  sp:15,         grp:'ngu'},

  /* ☀️ CHIỀU */
  {k:'c_an', n:'Ăn trưa',        e:'🍜', p:1, hp:12,  sp:4,   m:-8,  grp:'an',  once:1},
  {k:'c_wr', n:'Viết luận',      e:'✍️', p:1, hp:-10, sp:-15, lu:1,  grp:'viet'},
  {k:'c_gv', n:'Gặp giáo sư',    e:'🧑‍🏫', p:1, hp:-3,  sp:-5,  kt:3, lu:2, grp:'viet', once:1},
  {k:'c_ta', n:'Trợ giảng',      e:'🎓', p:1, hp:-10, sp:-10, m:75,  grp:'lam'},
  {k:'c_cf', n:'Đi cafe',        e:'☕', p:1, hp:-2,  sp:18,  m:-25, grp:'choi'},

  /* 🌙 TỐI */
  {k:'t_an', n:'Ăn tối',         e:'🍲', p:2, hp:12,  sp:4,   m:-8,  grp:'an',  once:1},
  {k:'t_dh', n:'Dạy online',     e:'💻', p:2, hp:-10, sp:-12, m:70,  grp:'lam'},
  {k:'t_goi',n:'Gọi về nhà',     e:'📞', p:2, hp:0,   sp:25,  m:-5,  grp:'choi'},
  {k:'t_pho',n:'Đi phố',         e:'🚶', p:2, hp:-4,  sp:22,  m:-40, grp:'choi'},
  {k:'t_fx', n:'Sửa lỗi luận',   e:'🔍', p:2, hp:-4,  sp:-8,  lu:3,  grp:'viet'},
  {k:'t_ngu',n:'Ngủ',            e:'🌙', p:2, hp:18,  sp:35,         grp:'ngu', fixed:1}
];

/* ===== STATE ===== */
const D0=()=>({
  day:1,week:1,ch:1,period:0,hp:80,sp:70,kt:5,lu:0,
  money:START_MONEY,
  actedInPeriod:false,   // đã làm 1 hành động chưa
  ateInPeriod:false,     // đã ăn trong buổi chưa
  usedDay:{},
  flags:{},
  logDay:[], logWeek:[], logMonth:[], logAll:[],
  event:null,
  seen:0, snd:1, endReason:'',
  weekStart:{money:START_MONEY,lu:0,kt:5,hp:80,sp:70},
  monthStart:{money:START_MONEY,lu:0,kt:5,hp:80,sp:70}
});
let S=D0();
try{
  const raw=localStorage.getItem(KEY);
  if(raw){
    const o=JSON.parse(raw);
    if(o&&o.ch&&o.day) S=Object.assign(D0(),o);
  }
}catch(e){}

const T={modal:0,mq:[],sheet:''};

/* ===== SAVE ===== */
function pack(){return JSON.stringify({v:SAVE_VER,ts:Date.now(),data:S})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function saveSlot(){try{localStorage.setItem(SLOT,pack());return true}catch(e){return false}}
function loadSlot(){
  try{
    const raw=localStorage.getItem(SLOT);
    if(!raw) return false;
    const o=JSON.parse(raw);
    if(!o||o.v!==SAVE_VER||!o.data) return false;
    S=Object.assign(D0(),o.data);
    T.modal=0;T.mq=[];T.sheet='';
    $('#modal').classList.add('hide');
    $('#sheet').classList.add('hide');
    return true;
  }catch(e){return false}
}
const hasSlot=()=>!!localStorage.getItem(SLOT);
function slotInfo(){
  try{
    const raw=localStorage.getItem(SLOT);

      time:`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} ${d.getDate()}/${d.getMonth()+1}`};

}

/* ===== AUDIO ===== */
let AC=null;
function beep(f=600,d=.1){
  if(!S.snd) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.04,t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);
    o.start(t);o.stop(t+d);
  }catch(e){}
}

const setTxt=(id,v)=>{const e=el(id);if(e&&e.textContent!==v)e.textContent=v};
const setW=(id,v)=>{const e=el(id);const w=v+'%';if(e&&e.style.width!==w)e.style.width=w};

function moodText(){
  if(S.hp<20) return 'Vân Khánh mệt lả, cần nghỉ ngơi.';
  if(S.sp<20) return 'Vân Khánh chán nản, không muốn làm gì.';
  if(S.hp<40) return 'Vân Khánh hơi đuối sức.';

function drawHead(){

function drawScene(){

  setTxt('weekV',WD[(S.day-1)%7]);
  setTxt('periodV',PERIODS[S.period]);

  } else nEl.classList.remove('on');

function drawActs(){
  const period=S.period;
  const list=ACTS.filter(a=>a.p==period);
  const done=S.actedInPeriod;
  const lbl=(()=>{
    if(done && period<2) return `Đã xong buổi ${['sáng','chiều'][period]} → bấm tiếp để chuyển`;
    if(done && period==2) return 'Đã xong buổi tối → bấm Ngủ để kết thúc ngày';
    return `Chọn 1 hành động cho buổi ${['sáng','chiều','tối'][period]}`;
  })();
  setTxt('period-lbl',lbl);

  const html=[];
  for(let i=0;i<list.length;i++){
    const a=list[i];
    let dis=false,cls='';
    // đã làm gì đó trong buổi (trừ ăn)
    if(done && !a.fixed) dis=true;
    if(a.once && S.usedDay[a.k]) dis=true;
    if(a.k=='c_wr' && (S.hp<30||S.sp<30)) dis=true;
    if(a.m<0 && S.money<-a.m) dis=true;
    if(a.k=='c_wr' && S.lu>=100) dis=true;

    if(a.grp=='viet' && !dis) cls='good';
    else if(a.grp=='choi' && !dis) cls='hi';
    else if(a.grp=='lam' && !dis) cls='warn';
    else if(a.grp=='ngu' && !dis) cls='sleep';
    else if(a.grp=='an' && !dis) cls='an';
    if(dis) cls+=' dis';
    const cost=a.m?`<small>${a.m>0?'+':''}${a.m}</small>`:'';
    html.push(`<button class="act ${cls}" data-a="do" data-k="${a.k}"><b>${a.e}</b><span>${a.n}</span>${cost}</button>`);
  }
  const actsEl=$('#acts');
  const h=html.join('');
  if(actsEl._h!==h){actsEl._h=h;actsEl.innerHTML=h}
}
function drawAll(){drawHead();drawScene();drawActs()}

function addLog(s){
  S.logDay.push(s);
  if(S.logDay.length>60) S.logDay.shift();
  S.logAll.push({d:S.day,s:s});
  if(S.logAll.length>500) S.logAll.shift();
}

function lowEff(){return (S.hp<30||S.sp<30)?0.5:1}

function applyAct(a){
  const eff=lowEff();
  if(a.hp) S.hp=cl(S.hp+Math.round(a.hp*eff),0,100);
  if(a.sp) S.sp=cl(S.sp+Math.round(a.sp*eff),0,100);
  if(a.m) S.money+=a.m;
  if(a.kt){
    const g=Math.round(a.kt*eff);
    S.kt+=g;
    addLog(`${a.e} ${a.n}: +${g} kiến thức`);
  } else if(a.lu){
    let g=a.lu;
    if(a.lu==1) g=8*(1+S.kt/50)*eff;
    g=Math.round(g*10)/10;
    S.lu=cl(S.lu+g,0,100);
    addLog(`${a.e} ${a.n}: +${g}% luận văn`);
  } else if(a.grp=='lam'){
    addLog(`${a.e} ${a.n}: +${a.m} tệ`);
  } else {
    addLog(`${a.e} ${a.n}`);
  }
  if(a.once) S.usedDay[a.k]=1;
  beep(a.grp=='viet'?880:a.grp=='choi'?660:520,.08);
}

  S.actedInPeriod=false;
  S.ateInPeriod=false;
  S.usedDay={};
  S.logDay=[];
  S.hp=cl(S.hp+2,0,100);
  S.sp=cl(S.sp+2,0,100);
  checkStory();
  save();drawAll();
}
function endWeek(){
  const scholar=SCHOLAR[S.ch];

  S.money+=scholar;

    scholar,rent:RENT,lu:S.lu,kt:S.kt,hp:S.hp,sp:S.sp};
  S.logWeek.push(wLog);
  if(S.logWeek.length>30) S.logWeek.shift();
  if(S.week%4==0){
    S.logMonth.push({month:Math.floor(S.week/4),w:Object.assign({},wLog)});

  }
  S.week++;
  S.day++;
  S.period=0;
  S.actedInPeriod=false;
  S.ateInPeriod=false;
  S.usedDay={};
  S.logDay=[];
  S.weekStart={money:S.money,lu:S.lu,kt:S.kt,hp:S.hp,sp:S.sp};

  <div class="mb"><button class="btn p" data-a="mx">Sang tuần ${S.week} 💕</button></div>`);
  if(S.money<0){

      <div class="ev">Cô ngồi trước cổng trường, kéo vali, không biết đi đâu.</div>

        <button class="btn p" data-a="restart">🔄 Chơi lại</button>
      </div>`);
    },300);
    return;
  }

/* ===== ACTION ===== */
function doAct(k){
  if(T.modal) return;
  const a=ACTS.find(x=>x.k==k);
  if(!a) return;
  if(S.actedInPeriod && !a.fixed) return toast('Buổi này đã làm rồi');
  if(a.once && S.usedDay[a.k]) return toast('Hôm nay đã làm rồi');
  if(a.k=='c_wr' && (S.hp<30||S.sp<30)) return toast('Cần HP, SP ≥ 30');
  if(a.m<0 && S.money<-a.m) return toast('Không đủ tiền');
  if(a.k=='c_wr' && S.lu>=100) return;

  applyAct(a);

  // Ngủ → kết thúc ngày
  if(a.fixed){
    drawAll();
    setTimeout(()=>endDay(),400);
    return;
  }

  // Ăn → cho làm tiếp 1 việc trong buổi
  if(a.grp=='an'){
    S.ateInPeriod=true;
    // actedInPeriod vẫn false → cho chọn thêm 1 hành động
  } else {
    // việc khác → chuyển sang buổi kế
    S.actedInPeriod=true;   // đánh dấu đã xong buổi này
    // người chơi bấm tiếp sẽ chuyển buổi (xử lý ở nextPeriod)
  }

  // HP thấp → nghỉ ốm
  if(S.hp<20 && S.hp>0){
    drawAll();
    setTimeout(()=>{
      modal(`<h2>🤒 Vân Khánh ốm</h2>
      <div class="body">HP xuống dưới 20. Cô phải nghỉ ngơi một ngày.</div>
      <div class="mb"><button class="btn p" data-a="mx">Cố lên.</button></div>`);
      S.hp=50;
      S.sp=Math.max(30,S.sp);
      S.day++;
      S.period=0;
      S.actedInPeriod=false;
      S.ateInPeriod=false;
      S.usedDay={};
      S.logDay=[];
      save();drawAll();
    },400);
    return;
  }
  if(S.hp<=0) S.hp=30;

  checkStory();
  save();
  drawAll();
}

/* chuyển sang buổi kế khi bấm lại */
function nextPeriod(){
  if(!S.actedInPeriod) return false;
  if(S.period>=2) return false;
  S.period++;
  S.actedInPeriod=false;
  S.ateInPeriod=false;
  S.usedDay={};   // reset once để ăn ở buổi mới
  save();
  drawAll();
  return true;
}

    if(S.lu>=40 && !S.flags.tet){S.flags.tet=1;S.sp=cl(S.sp-15,0,100);
      modal(`<h2>🏮 Tết xa nhà</h2><div class="body">Mẹ gọi video, cả nhà quây quần. Vân Khánh cười, nước mắt chảy.</div><div class="ev">"Ráng lên con. Mẹ chờ ngày con tốt nghiệp."</div><div class="mb"><button class="btn p" data-a="mx">Vâng mẹ.</button></div>`)}
    if(S.lu>=60 && !S.flags.dad){S.flags.dad=1;S.sp=cl(S.sp-20,0,100);
      modal(`<h2>📞 Bố ốm</h2><div class="body">Em gái nhắn tin: bố nhập viện. Không nặng, nhưng Vân Khánh không thể về.</div><div class="mb"><button class="btn p" data-a="mx">Cố lên.</button></div>`)}
    if(S.lu>=80 && !S.flags.def2){S.flags.def2=1;
      modal(`<h2>📖 Bảo vệ thử</h2><div class="body">Giáo sư Lý: "Chương 3 và 4 ổn. Nhưng phần mở đầu cần viết lại."</div><div class="mb"><button class="btn p" data-a="mx">Vâng.</button></div>`)}
    if(S.ch==2 && S.week==2 && !S.flags.sg){S.flags.sg=1;
      startEvent('Singapore',2000,20,4,15,3)}
    if(S.ch==2 && S.week==6 && !S.flags.tk){S.flags.tk=1;
      startEvent('Tokyo',2500,25,5,20,3)}
  }
}

/* ===== EVENT ===== */
function startEvent(city,cost,kt,lu,sp,daysAhead){
  S.event={city,cost,kt,lu,sp,triggerDay:S.day+daysAhead};
  save();
  toast(`📢 Hội thảo ${city}! Cần ${cost} tệ · còn ${daysAhead} ngày`);
}
function eventGo(){
  if(!S.event) return;
  if(S.money<S.event.cost){ toast('❌ Không đủ tiền để đi!'); return; }
  if(!confirm(`Đi hội thảo ${S.event.city}?\nTốn ${S.event.cost} tệ.`)) return;
  const e=S.event;
  S.money-=e.cost;
  S.kt+=e.kt;
  S.lu=cl(S.lu+e.lu,0,100);
  S.sp=cl(S.sp+e.sp,0,100);
  addLog(`🌏 Hội thảo ${e.city}: −${e.cost} tệ, +${e.kt} KT, +${e.lu}% luận`);
  S.event=null;
  beep(990,.3);
  toast(`✅ Đã đi hội thảo ${e.city}!`);
  save();drawAll();
  checkStory();
}
function eventNo(){
  if(!S.event) return;
  if(!confirm('Không đi hội thảo này?')) return;
  S.sp=cl(S.sp-5,0,100);
  addLog(`😔 Bỏ lỡ hội thảo ${S.event.city}`);
  S.event=null;
  save();drawAll();
}

/* ===== FINISH ===== */
function finishGrad(){
  if(S.endReason=='grad') return;
  S.endReason='grad';
  const total=S.day;
  const ch1=window.__ch1Days||total;
  const ch2=Math.max(0,total-ch1);
  addFinish(total,ch1,ch2);
  save();
  beep(1200,.5);
  modal(`<div class="sp"><img src="icon-192.png" alt=""></div>
  <h2>🎓 Lễ tốt nghiệp</h2>
  <div class="body">
  Vân Khánh bảo vệ luận án tiến sĩ tại SISU Thượng Hải thành công.
  <br><br>
  <b>Bố, mẹ và em gái từ Việt Nam bay sang dự lễ.</b> Mẹ mặc áo dài, khóc khi thấy con gái mặc áo tốt nghiệp. Bố im lặng nhưng mắt đỏ. Em gái chụp ảnh lia lịa.
  <br><br>
  Giáo sư Lý gật đầu: <i>"Cô xứng đáng."</i>
  </div>
  <div class="ev">
  Vân Khánh mở cuốn nhật ký, viết dòng cuối:
  <br><br>
  <i>"Ngày ấy con hứa với mẹ — con làm được rồi."</i>
  </div>
  <div class="g2" style="margin-top:10px">
    <span>Tổng số ngày</span><b>${total}</b>
    <span>Chương 1 (Thạc sĩ)</span><b>${ch1} ngày</b>
    <span>Chương 2 (Tiến sĩ)</span><b>${ch2} ngày</b>
    <span>Tiền còn lại</span><b>${F(S.money)} tệ</b>
  </div>
  <div class="mb2">
    <button class="btn" data-a="record">🏆 Kỷ lục</button>
    <button class="btn p" data-a="restart">🔄 Chơi lại</button>
  </div>`);
}
function finishHome(){
  if(!confirm('Vân Khánh gấp cuốn nhật ký, đặt bút xuống?\n\nKết thúc sớm — không tính kỷ lục.')) return;
  if(!confirm('Chắc chắn chứ?')) return;
  S.endReason='home';
  save();
  modal(`<div class="sp"><img src="icon-192.png" alt=""></div>
  <h2>🏠 Về nhà</h2>
  <div class="body">
  Vân Khánh gấp cuốn nhật ký, đặt bút xuống. Cô đặt vé máy bay về Việt Nam.
  <br><br>
  Có những giấc mơ không cần hoàn thành — chỉ cần mình biết mình đã cố gắng.
  </div>
  <div class="ev"><i>— HẾT —</i></div>
  <div class="mb2">
    <button class="btn" data-a="record">🏆 Kỷ lục</button>
    <button class="btn p" data-a="restart">🔄 Chơi lại</button>
  </div>`);
}

/* ===== SHEETS ===== */
function openLog(){
  T.sheet='log';
  setTxt('sht','📖 Nhật ký');
  let html='';
  if(S.logWeek.length){
    html='<h3>Log tuần</h3>'+S.logWeek.slice().reverse().map(w=>`
      <div class="it"><div class="m"><b>Tuần ${w.week}</b>
      <small>HB +${w.scholar} · Nhà −${w.rent} · Còn ${F(w.moneyAfter)} tệ</small>
      <small>Luận văn ${w.lu.toFixed(1)}% · KT ${Math.round(w.kt)}</small>
      </div></div>`).join('');
  }
  const arr=S.logAll.slice(-80).reverse();
  if(arr.length){
    html+='<h3>Nhật ký gần đây</h3>'+arr.map(x=>`<div class="it"><div class="m"><b>Ngày ${x.d}</b><small>${x.s}</small></div></div>`).join('');
  } else if(!html) html='<div class="sm mu">Chưa có gì.</div>';
  $('#shb').innerHTML=html;
  $('#sheet').classList.remove('hide');
}
function openRecord(){
  T.sheet='record';
  setTxt('sht','🏆 Kỷ lục');
  const r=getRec();
  const fin=(r.fin||[]).slice().reverse().slice(0,5);
  $('#shb').innerHTML=`
    <div class="ev"><b>Kỷ lục tốt nhất</b>
    <div class="g2" style="margin-top:6px">
      <span>🥇 Chương 1</span><b>${r.b1?r.b1+' ngày':'—'}</b>
      <span>🥇 Chương 2</span><b>${r.b2?r.b2+' ngày':'—'}</b>
      <span>🥇 Tổng cộng</span><b>${r.bT?r.bT+' ngày':'—'}</b>
    </div></div>
    <h3>Lần chơi gần đây</h3>
    ${fin.length? fin.map(f=>`<div class="it"><div class="m"><b>Tổng ${f.t} ngày</b><small>C1: ${f.c1} ngày · C2: ${f.c2} ngày</small></div></div>`).join('') : '<div class="sm mu">Chưa hoàn thành lần nào.</div>'}
    <h3>💾 Save</h3>
    <div class="bs" style="margin-bottom:8px">
      <button class="b2 p" data-a="save">💾 Lưu</button>
      <button class="b2 ${hasSlot()?'g':''}" data-a="load" ${hasSlot()?'':'disabled'}>📂 Tải</button>
      <button class="b2" data-a="export">⬇️ Xuất</button>
      <button class="b2" data-a="import">⬆️ Nhập</button>
    </div>
    <div class="bs" style="margin-top:8px">
      <button class="b2" data-a="snd">🔊 ${S.snd?'Bật':'Tắt'}</button>
      <button class="b2" data-a="help">❓ Hướng dẫn</button>
      <button class="b2" data-a="wipeslot">🗑️ Xoá save</button>
      <button class="b2" data-a="restart">💥 Chơi lại</button>
    </div>`;
  $('#sheet').classList.remove('hide');
}
function reSheet(){if(T.sheet){if(T.sheet=='log')openLog();else if(T.sheet=='record')openRecord()}}

/* ===== EVENTS ===== */
document.addEventListener('click',e=>{
  const target=e.target.closest('[data-a]');
  if(!target) return;
  const a=target.dataset.a,k=target.dataset.k;
  switch(a){
    case 'do':
      // nếu đã actedInPeriod → chuyển buổi thay vì làm việc
      if(S.actedInPeriod && S.period<2){ nextPeriod(); break; }
      doAct(k);
      break;
    case 'log':openLog();break;
    case 'record':openRecord();break;
    case 'home':finishHome();break;
    case 'closeSheet':closeSheet();break;
    case 'mx':mclose();break;
    case 'help':closeSheet();modal(HELP);break;
    case 'save':manualSave();reSheet();break;
    case 'load':manualLoad();break;
    case 'export':exportSave();break;
    case 'import':importSave();break;
    case 'snd':S.snd^=1;save();reSheet();break;
    case 'wipeslot':
      if(!hasSlot()) return toast('📭 Chưa có save');
      if(confirm('Xoá save thủ công?')){deleteSlot();toast('🗑️ Đã xoá');reSheet()}
      break;
    case 'restart':
      if(!confirm('Chơi lại từ đầu?')) return;
      localStorage.removeItem(KEY);
      location.reload();
      break;
    case 'evGo':eventGo();break;
    case 'evNo':eventNo();break;
  }
});
const sheetEl=$('#sheet');
if(sheetEl) sheetEl.addEventListener('click',e=>{
  if(e.target.id=='sheet') closeSheet();
});

/* ===== NO LOOP — game hoàn toàn event-driven ===== */

/* ===== KICKOFF ===== */
window.__ch1Days=null;
window.__ch1Weeks=null;
drawAll();
if(!S.seen){
  S.seen=1;save();
  modal(INTRO);
}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
