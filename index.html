<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no,maximum-scale=1">
<meta name="theme-color" content="#ffb6d5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>🌸 Vân Khánh Diary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1428;
  --ink2:#3a2a4a;
  --mu:#8a7a9a;
  --pink:#ffc6dd;
  --rose:#ff6b9d;
  --lav:#c9b6f0;
  --mint:#a8e6d0;
  --honey:#ffe4a8;
  --shadow:3px 3px 0 var(--ink);
  --radius:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:600 13.5px/1.35 "Quicksand",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{
  background:
    radial-gradient(circle at 8% 12%,rgba(255,200,220,.5) 0 6px,transparent 7px),
    radial-gradient(circle at 88% 22%,rgba(255,220,240,.45) 0 5px,transparent 6px),
    radial-gradient(circle at 22% 78%,rgba(220,190,240,.4) 0 5px,transparent 6px),
    radial-gradient(circle at 78% 88%,rgba(255,200,220,.4) 0 6px,transparent 7px),
    linear-gradient(160deg,#fff5f9 0%,#fdeef8 25%,#f5ecff 55%,#e8f4ff 85%,#e0f0ff 100%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
.hide{display:none!important}.mu{color:var(--mu)}.sm{font-size:11px}

#app{
  height:100vh;height:100dvh;max-width:480px;margin:0 auto;
  display:grid;grid-template-rows:auto minmax(0,1fr) auto;
  gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 9px calc(env(safe-area-inset-bottom) + 8px);
  position:relative;
}

/* ===== HEADER ===== */
#hd{
  position:relative;border-radius:var(--radius);
  border:2px solid var(--ink);
  box-shadow:var(--shadow);
  overflow:hidden;
  background:linear-gradient(155deg,#ffb3d1 0%,#ff8fb8 40%,#c9b6f0 100%);
}
#hd .top{
  display:flex;align-items:center;gap:8px;
  padding:8px 10px;
  border-bottom:1.5px solid rgba(26,20,40,.35);
}
#logo{
  flex:none;width:32px;height:32px;border-radius:50%;object-fit:cover;
  border:2px solid var(--ink);
  background:#ffc6dd;
}
.logo-wrap{flex:1;min-width:0}
.logo-wrap .t{
  font-family:"Comfortaa","Quicksand",sans-serif;
  font-weight:700;font-size:14px;color:#fff;
  text-shadow:1px 1px 0 rgba(26,20,40,.5);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.logo-wrap .t small{
  display:block;font-size:8.5px;opacity:.9;
  letter-spacing:1.5px;font-weight:700;margin-top:1px;
  color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.5);
}
.stats-row{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:5px;padding:8px 10px 4px;
}
.stat{
  display:flex;align-items:center;justify-content:center;gap:3px;
  background:rgba(255,255,255,.92);
  border:2px solid var(--ink);
  border-radius:8px;
  padding:5px 3px;
  font-weight:800;font-size:12.5px;color:var(--ink);
  box-shadow:1.5px 1.5px 0 var(--ink);
  min-width:0;
}
.stat b{font-weight:400;font-size:14px;line-height:1}
.bars{padding:2px 10px 10px;display:grid;gap:5px}
.bar-w{
  position:relative;height:20px;
  border:2px solid var(--ink);border-radius:8px;
  background:#fff;overflow:hidden;
  box-shadow:1.5px 1.5px 0 var(--ink);
}
.bar-w i{
  position:absolute;left:0;top:0;bottom:0;
  display:block;width:0;transition:width .35s;
}
.bar-w.hp i{background:linear-gradient(90deg,#ffb3c1,#ff6b9d)}
.bar-w.lu i{background:linear-gradient(90deg,#c9b6f0,#a890e0)}
.bar-w .lbl{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 8px;
  font-size:10.5px;font-weight:800;color:var(--ink);
  text-shadow:0 0 3px rgba(255,255,255,.9);
}

/* ===== EVENT NOTICE ===== */
#evNotice{
  display:none;
  margin:8px 10px 0;
  padding:8px 10px;
  border:2px solid var(--ink);border-radius:10px;
  background:linear-gradient(180deg,#fff3c9,#ffe0a0);
  box-shadow:2px 2px 0 var(--ink);
  font-size:11.5px;color:var(--ink);font-weight:700;line-height:1.5;
}
#evNotice.on{display:block}
#evNotice .row1{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px}
#evNotice .city{font-size:13px;font-weight:800}
#evNotice .short{color:#c92e72;font-weight:800}
#evNotice .btns{display:flex;gap:5px;margin-top:5px}
#evNotice .btns button{
  flex:1;padding:6px 10px;
  border:2px solid var(--ink);border-radius:8px;
  font-weight:800;font-size:11.5px;
  box-shadow:1.5px 1.5px 0 var(--ink);
}
#evNotice .btns .go{background:linear-gradient(180deg,#a8e6d0,#7ecbaf);color:#fff}
#evNotice .btns .no{background:linear-gradient(180deg,#fff,#f0eaff)}
#evNotice .btns button:disabled{opacity:.5;filter:grayscale(.5)}

/* ===== SCENE ===== */
#scene{
  position:relative;overflow:hidden;
  display:flex;flex-direction:column;
  border:2px solid var(--ink);border-radius:var(--radius);
  box-shadow:var(--shadow);min-height:0;background:#fff;
}
.ch1 #scene{background:linear-gradient(180deg,#ffe9c9 0 40px,#fff8ee 40px)}
.ch2 #scene{background:linear-gradient(180deg,#a8c8e8 0 40px,#f0f8ff 40px)}
#top-info{text-align:center;padding:8px 12px 6px}
#top-info .date{font-family:"Comfortaa",sans-serif;font-size:14px;font-weight:700}
#top-info .weekday{font-size:11px;font-weight:700;color:var(--ink2);margin-top:1px}
#top-info .period{
  display:inline-block;margin-top:6px;padding:4px 16px;
  border:2px solid var(--ink);border-radius:20px;
  background:rgba(255,255,255,.85);
  font-size:12px;font-weight:800;
  box-shadow:1.5px 1.5px 0 var(--ink);
}
#avatar-w{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:4px 12px;min-height:0;
}
#avatar{
  width:82px;height:82px;border-radius:50%;object-fit:cover;
  border:2px solid var(--ink);
  box-shadow:3px 3px 0 var(--ink);
  background:#ffc6dd;margin-bottom:7px;
}
#mood{
  font-size:12px;font-weight:700;color:var(--ink);
  text-align:center;padding:4px 14px;
  background:rgba(255,255,255,.85);
  border:2px solid var(--ink);border-radius:20px;
  box-shadow:1.5px 1.5px 0 var(--ink);
  max-width:92%;
}
#log{
  margin:6px 10px 10px;padding:6px 10px;
  background:rgba(255,255,255,.9);
  border:1.5px solid var(--ink);border-radius:10px;
  font-size:11px;color:var(--ink);line-height:1.5;
  max-height:70px;overflow:hidden;min-height:42px;
  box-shadow:1.5px 1.5px 0 var(--ink);
}
#log .ln{display:block}
#log .ln::before{content:"· ";opacity:.5;font-weight:800}

/* ===== ACTION PANEL ===== */
#acts-wrap{
  border:2px solid var(--ink);border-radius:var(--radius);
  background:#fff;box-shadow:var(--shadow);padding:10px;
}
#period-lbl{
  text-align:center;font-size:11.5px;font-weight:800;
  letter-spacing:.5px;margin-bottom:8px;padding-bottom:6px;
  border-bottom:1.5px dashed rgba(26,20,40,.3);
}
#acts{
  display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;
}
.act{
  position:relative;
  border:2px solid var(--ink);border-radius:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:800;font-size:11.5px;line-height:1.15;
  height:clamp(58px,7.4vh,70px);
  background:linear-gradient(180deg,#fff,#f5f0ff);
  color:var(--ink);padding:3px;
  box-shadow:2px 2px 0 var(--ink);
  transition:transform .1s;
}
.act b{font-size:22px;line-height:1.1;margin-bottom:2px;font-weight:400}
.act span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act small{
  position:absolute;top:2px;right:5px;
  font-size:8.5px;font-weight:800;padding:1px 5px;
  border:1.5px solid var(--ink);border-radius:6px;
  background:rgba(255,255,255,.9);color:var(--ink);
}
.act:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.act.dis{opacity:.42;filter:grayscale(.7)}
.act.eaten{background:linear-gradient(180deg,#e8e2f0,#d8d0e5);color:var(--mu);text-decoration:line-through}
.act.hoc{background:linear-gradient(180deg,#c9f2df,#a8e6d0)}
.act.lam{background:linear-gradient(180deg,#ffeec4,#ffe4a8)}
.act.viet{background:linear-gradient(180deg,#a8e6d0,#7ecbaf);color:#fff}
.act.choi{background:linear-gradient(180deg,#ffc6dd,#ff9bbf);color:#fff}
.act.sleep{background:linear-gradient(180deg,#c9b6f0,#a890e0);color:#fff}

#nextBtn{
  width:100%;margin-top:8px;padding:11px;
  border:2px solid var(--ink);border-radius:10px;
  font-family:"Comfortaa",sans-serif;
  font-size:13px;font-weight:800;
  background:linear-gradient(180deg,#a8e6d0,#7ecbaf);
  color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.4);
  box-shadow:2px 2px 0 var(--ink);
  letter-spacing:.5px;
}
#nextBtn:disabled{
  background:linear-gradient(180deg,#e8e2f0,#d8d0e5);
  color:var(--mu);text-shadow:none;opacity:.7;
}
#nextBtn:not(:disabled):active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

/* ===== FAB NGỦ ===== */
#sleepFab{
  position:fixed;
  right:14px;
  bottom:calc(env(safe-area-inset-bottom) + 110px);
  width:56px;height:56px;
  border-radius:50%;
  border:2px solid var(--ink);
  background:linear-gradient(180deg,#c9b6f0,#a890e0);
  color:#fff;font-size:24px;
  display:grid;place-items:center;
  box-shadow:3px 3px 0 var(--ink);
  z-index:20;transition:transform .15s;
}
#sleepFab:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
#sleepFab::after{
  content:"Ngủ";position:absolute;bottom:-16px;
  font-size:9px;font-weight:800;color:var(--ink);
  background:rgba(255,255,255,.9);padding:1px 6px;border-radius:6px;
  border:1.5px solid var(--ink);white-space:nowrap;
}
@media (min-width:520px){
  #sleepFab{right:calc(50% - 240px + 14px)}
}

/* ===== NAV ===== */
#nav{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
#nav button{
  border:2px solid var(--ink);border-radius:10px;
  font-size:11px;font-weight:800;padding:9px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;
  background:linear-gradient(180deg,#fff,#f5eeff);
  color:var(--ink);box-shadow:2px 2px 0 var(--ink);
  font-family:"Comfortaa","Quicksand",sans-serif;
}
#nav button b{font-size:17px;line-height:1;font-weight:400}
#nav button:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}

/* ===== SHEET / MODAL ===== */
#sheet{
  position:fixed;inset:0;z-index:50;background:rgba(26,20,40,.55);
  display:flex;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
}
.shx{
  width:100%;max-width:480px;max-height:82vh;overflow:auto;
  border:2px solid var(--ink);border-bottom:0;
  border-radius:20px 20px 0 0;
  padding:14px 16px calc(env(safe-area-inset-bottom) + 18px);
  background:#fff;box-shadow:0 -6px 0 var(--ink);
  animation:sup .28s cubic-bezier(.2,1.3,.5,1);
}
@keyframes sup{from{transform:translateY(100%)}}
.shh{
  display:flex;align-items:center;font-size:16px;font-weight:800;
  margin-bottom:10px;padding-bottom:8px;
  border-bottom:2px dashed rgba(26,20,40,.35);
  font-family:"Comfortaa",sans-serif;
}
.shh b{flex:1}
h3{
  margin:14px 0 6px;font-size:13.5px;font-weight:800;
  display:flex;align-items:center;gap:6px;
  font-family:"Comfortaa",sans-serif;
}
h3::before{content:"✿";color:var(--rose);font-size:16px}
.it{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;
  border:1.5px solid var(--ink);border-radius:9px;
  background:#fff;box-shadow:1.5px 1.5px 0 var(--ink);
  margin-bottom:6px;
}
.it .m{flex:1;min-width:0}
.it .m b{display:block;font-size:12.5px}
.it small{display:block;color:var(--ink2);font-weight:600;margin-top:2px;font-size:11px}
.bs{display:flex;gap:6px;flex-wrap:wrap}
.b2{
  border:2px solid var(--ink);border-radius:9px;
  padding:7px 12px;font-weight:800;font-size:12px;white-space:nowrap;
  background:linear-gradient(180deg,#fff,#f0eaff);
  color:var(--ink);box-shadow:2px 2px 0 var(--ink);
}
.b2.p{background:linear-gradient(180deg,#ffb3d1,#ff8fb8);color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3)}
.b2.g{background:linear-gradient(180deg,#a8e6d0,#7ecbaf);color:#fff;text-shadow:1px 1px 0 rgba(26,20,40,.3)}
.b2:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--ink)}
.b2:disabled{opacity:.45;filter:grayscale(.5)}

#modal{
  position:fixed;inset:0;z-index:60;background:rgba(26,20,40,.6);
  display:grid;place-items:center;padding:16px;
  backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);
}
.bx{
  width:100%;max-width:420px;max-height:88vh;overflow:auto;
  border:2px solid var(--ink);border-radius:18px;
  padding:20px;background:#fff;
  box-shadow:6px 6px 0 var(--ink);
  animation:pp .28s cubic-bezier(.2,1.3,.5,1);
}
@keyframes pp{from{transform:scale(.88);opacity:0}}
.bx h2{
  margin:0 0 12px;text-align:center;font-size:19px;
  padding-bottom:8px;border-bottom:2px dashed rgba(26,20,40,.35);
  font-family:"Comfortaa",sans-serif;
}
.bx .body{font-size:13px;line-height:1.6}
.bx .body b{color:var(--rose)}
.ev{
  background:linear-gradient(180deg,#fff8e0,#ffeec0);
  border:2px solid var(--ink);border-radius:10px;
  padding:10px 12px;margin:8px 0;
  box-shadow:2px 2px 0 var(--ink);
}
.g2{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:12.5px}
.mb{display:grid;gap:10px;margin-top:14px}
.mb2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sp{display:flex;justify-content:center;margin:8px 0 6px}
.sp img{
  width:80px;height:80px;border-radius:50%;object-fit:cover;
  border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);
  background:#ffc6dd;
}
#toast{
  position:fixed;left:50%;top:22%;transform:translateX(-50%);
  z-index:70;display:grid;gap:6px;width:min(92vw,420px);pointer-events:none;
}
#toast div{
  background:linear-gradient(180deg,#ffb3d1,#ff8fb8);
  color:#fff;border:2px solid var(--ink);border-radius:12px;
  padding:8px 14px;text-align:center;font-weight:800;font-size:12.5px;
  box-shadow:3px 3px 0 var(--ink);
  text-shadow:1px 1px 0 rgba(26,20,40,.3);
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body class="ch1">
<div id="app">
  <header id="hd">
    <div class="top">
      <img id="logo" src="icon-192.png" alt="Vân Khánh">
      <div class="logo-wrap">
        <div class="t">Vân Khánh Diary<small id="chapLbl">✿ THẠC SĨ · CNU BẮC KINH ✿</small></div>
      </div>
    </div>
    <div class="stats-row">
      <span class="stat">⚡<b id="hpV">80</b></span>
      <span class="stat">💗<b id="spV">70</b></span>
      <span class="stat">💰<b id="moneyV">500</b></span>
      <span class="stat">📚<b id="ktV">5</b></span>
    </div>
    <div class="bars">
      <div class="bar-w hp"><i id="hpB"></i><span class="lbl"><span>HP</span><span id="hpLbl">80 / 100</span></span></div>
      <div class="bar-w lu"><i id="lvB"></i><span class="lbl"><span>Luận văn</span><span id="lvLbl">0.0%</span></span></div>
    </div>
  </header>

  <section id="scene">
    <div id="top-info">
      <div class="date" id="dateV">Ngày 1 · Tuần 1</div>
      <div class="weekday" id="weekV">Thứ Hai</div>
      <div class="period" id="periodV">🌅 Buổi sáng</div>
    </div>
    <div id="evNotice"></div>
    <div id="avatar-w">
      <img id="avatar" src="icon-192.png" alt="Vân Khánh">
      <div id="mood">Vân Khánh đang chuẩn bị cho ngày mới.</div>
    </div>
    <div id="log"><span class="ln" style="opacity:.55">Nhật ký sẽ ghi lại ở đây...</span></div>
  </section>

  <div id="acts-wrap">
    <div id="period-lbl">BUỔI SÁNG · Chọn 1 hành động</div>
    <div id="acts"></div>
    <button id="nextBtn" data-a="next" disabled>➡️ SANG BUỔI CHIỀU</button>
    <nav id="nav">
      <button data-a="log"><b>📖</b>Nhật ký</button>
      <button data-a="record"><b>🏆</b>Kỷ lục</button>
      <button data-a="home"><b>🏠</b>Về nhà</button>
    </nav>
  </div>
</div>

<button id="sleepFab" data-a="sleep" title="Ngủ">🌙</button>

<div id="sheet" class="hide"><div class="shx"><div class="shh"><b id="sht"></b><button class="b2" data-a="closeSheet">✕</button></div><div id="shb"></div></div></div>
<div id="modal" class="hide"></div>
<div id="toast"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const F=n=>Math.round(n).toLocaleString('vi-VN');

const KEY='vkdiary_v6';
const SLOT='vkdiary_slot_v6';
const REC_KEY='vkdiary_rec_v6';
const SAVE_VER=6;
const RENT=1000;
const SCHOLAR=[0,2500,3500];
const START_MONEY=500;
const MAX_WEEKS=[0,36,72];        // [_ , thạc sĩ 36 tuần, tiến sĩ 72 tuần]
const WRITE_RATE=[0,5,4];          // %/lần viết cho từng chương

const WD=['Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy','Chủ Nhật'];
const PERIODS=['🌅 Buổi sáng','☀️ Buổi chiều','🌙 Buổi tối'];
const EAT_LABELS=[
  {k:'eat0', n:'Ăn sáng', e:'🍚', m:-5,  hp:8,  sp:3, p:0},
  {k:'eat1', n:'Ăn trưa', e:'🍜', m:-8,  hp:12, sp:4, p:1},
  {k:'eat2', n:'Ăn tối',  e:'🍲', m:-8,  hp:12, sp:4, p:2}
];

/* Hành động (không có ăn — ăn mặc định) */
const ACTS=[
  /* 🌅 SÁNG */
  {k:'s_tv', n:'Thư viện', e:'📚', p:0, hp:-6, sp:-12, kt:18, grp:'hoc'},
  {k:'s_tt', n:'Học tiếng', e:'🀄', p:0, hp:-4, sp:-8, kt:6, grp:'hoc'},
  {k:'s_ts', n:'Pha trà sữa', e:'🧋', p:0, hp:-8, sp:-10, m:45, grp:'lam'},
  {k:'s_ng', n:'Ngủ nướng', e:'😴', p:0, hp:10, sp:15, grp:'ngu'},

  /* ☀️ CHIỀU */
  {k:'c_wr', n:'Viết luận', e:'✍️', p:1, hp:-10, sp:-15, lu:1, grp:'viet'},
  {k:'c_gv', n:'Gặp GV', e:'🧑‍🏫', p:1, hp:-3, sp:-5, kt:3, lu:2, grp:'viet'},

  day:1,week:1,ch:1,period:0,hp:80,sp:70,kt:5,lu:0,

try{

/* ===== SAVE ===== */
function pack(){return JSON.stringify({v:SAVE_VER,ts:Date.now(),data:S})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function saveSlot(){try{localStorage.setItem(SLOT,pack());return true}catch(e){return false}}
function loadSlot(){
  try{
    const raw=localStorage.getItem(SLOT);
    if(!raw) return false;
    const o=JSON.parse(raw);
    if(!o||o.v!==SAVE_VER||!o.data) return false;
    S=Object.assign(D0(),o.data);
    T.modal=0;T.mq=[];T.sheet='';
    $('#modal').classList.add('hide');
    $('#sheet').classList.add('hide');
    return true;
  }catch(e){return false}
}
const hasSlot=()=>!!localStorage.getItem(SLOT);
function slotInfo(){
  try{
    const raw=localStorage.getItem(SLOT);
    if(!raw) return null;
    const o=JSON.parse(raw);
    const d=new Date(o.ts);
    return {day:o.data.day,ch:o.data.ch,lu:o.data.lu,
      time:`${d.getHours()}:${String(d.getMinutes()).padStart(2,'0')} ${d.getDate()}/${d.getMonth()+1}`};
  }catch(e){return null}
}
function deleteSlot(){try{localStorage.removeItem(SLOT);return true}catch(e){return false}}
function exportSave(){
  try{
    const blob=new Blob([pack()],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`van-khanh-diary-ngay${S.day}.json`;
    document.body.append(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast('💾 Đã xuất file!');
  }catch(e){toast('❌ Không xuất được')}
}
function importSave(){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='.json,application/json';
  inp.onchange=()=>{
    const f=inp.files&&inp.files[0];if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const o=JSON.parse(r.result);
        if(!o||!o.data) return toast('❌ File không hợp lệ');
        if(!confirm(`Nhập save Ngày ${o.data.day}?`)) return;
        S=Object.assign(D0(),o.data);save();drawAll();
        toast('✅ Đã nhập save!');
      }catch(e){toast('❌ Lỗi đọc file')}
    };
    r.readAsText(f);
  };
  inp.click();
}
function manualSave(){saveSlot()?toast('💾 Đã lưu!'):toast('❌ Không lưu được')}
function manualLoad(){
  if(!hasSlot()) return toast('📭 Chưa có save');
  const i=slotInfo();
  if(!confirm(`Tải save?\nNgày ${i.day} · C${i.ch} · Luận văn ${Math.round(i.lu)}%`)) return;
  if(loadSlot()){save();drawAll();toast('📂 Đã tải!')}

}

function getRec(){

}

function addFinish(tot,c1,c2){
  const r=getRec();
  r.fin=r.fin||[];
  r.fin.push({t:tot,c1,c2,ts:Date.now()});
  if(r.fin.length>10) r.fin=r.fin.slice(-10);
  if(!r.b1||c1<r.b1) r.b1=c1;
  if(!r.b2||c2<r.b2) r.b2=c2;
  if(!r.bT||tot<r.bT) r.bT=tot;
  saveRec(r);

/* ===== AUDIO ===== */
let AC=null;
function beep(f=600,d=.1){
  if(!S.snd) return;
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
    o.type='sine';o.frequency.value=f;
    g.gain.setValueAtTime(.04,t);
    g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(AC.destination);
    o.start(t);o.stop(t+d);
  }catch(e){}
}

const EL={};
const el=id=>EL[id]||(EL[id]=document.getElementById(id));
const setTxt=(id,v)=>{const e=el(id);if(e&&e.textContent!==v)e.textContent=v};
const setW=(id,v)=>{const e=el(id);const w=v+'%';if(e&&e.style.width!==w)e.style.width=w};

function moodText(){
  if(S.hp<20) return 'Vân Khánh mệt lả, cần nghỉ ngơi.';
  if(S.sp<20) return 'Vân Khánh chán nản, không muốn làm gì.';
  if(S.hp<40) return 'Vân Khánh hơi đuối sức.';
  if(S.sp<40) return 'Vân Khánh thấy mệt mỏi.';
  if(S.period==0) return 'Buổi sáng yên tĩnh, Vân Khánh ngồi bên cửa sổ.';
  if(S.period==1) return 'Buổi chiều, nắng nhạt chiếu qua khung cửa.';
  return 'Trời tối dần, Vân Khánh bật đèn bàn.';
}

function drawHead(){
  document.body.className='ch'+S.ch;
  setTxt('chapLbl',S.ch==1?'✿ THẠC SĨ · CNU BẮC KINH ✿':'✿ TIẾN SĨ · SISU THƯỢNG HẢI ✿');
  setTxt('hpV',Math.round(S.hp));
  setTxt('spV',Math.round(S.sp));
  setTxt('moneyV',F(S.money));
  setTxt('ktV',Math.round(S.kt));
  setW('hpB',S.hp);
  setW('lvB',S.lu);

  setTxt('lvLbl',S.lu.toFixed(1)+'%');
}
function drawScene(){
  const weeksLeft=MAX_WEEKS[S.ch]-S.week+1;
  setTxt('dateV',`Ngày ${S.day} · Tuần ${S.week}/${MAX_WEEKS[S.ch]}`);
  setTxt('weekV',WD[(S.day-1)%7]+` · còn ${weeksLeft} tuần`);
  setTxt('periodV',PERIODS[S.period]);
  setTxt('mood',moodText());
  const lines=S.logDay.slice(-3);
  const logEl=$('#log');
  const html=lines.length
    ? lines.map(l=>`<span class="ln">${l}</span>`).join('')
    : '<span class="ln" style="opacity:.55">Nhật ký sẽ ghi lại ở đây...</span>';
  if(logEl._h!==html){logEl._h=html;logEl.innerHTML=html}

  const nEl=$('#evNotice');

    const days=Math.max(0,S.event.triggerDay-S.day);

    nEl.classList.add('on');

      <div class="row1">
        <span class="city">📢 Hội thảo ${S.event.city}</span>
        <span>còn ${days} ngày</span>
      </div>
      <div>Cần: <b>${F(S.event.cost)} tệ</b> ${canGo?'':`· <span class="short">thiếu ${F(short)} tệ</span>`}</div>
      <div style="font-size:10.5px;opacity:.8;margin-top:2px">Thưởng: +${S.event.kt} KT · +${S.event.lu}% luận · +${S.event.sp} SP</div>
      <div class="btns">
        <button class="go" data-a="evGo" ${canGo?'':'disabled'}>Đi</button>
        <button class="no" data-a="evNo">Không đi</button>
      </div>`;
  } else nEl.classList.remove('on');
}

function drawActs(){
  const period=S.period;
  const list=ACTS.filter(a=>a.p==period);
  const done=S.actedInPeriod;

  setTxt('period-lbl',`BUỔI ${['SÁNG','CHIỀU','TỐI'][period]} · Chọn 1 hành động`);

  // Ăn mặc định đầu buổi
  const eat=EAT_LABELS[period];
  const eatDone=S.ateInPeriod;
  const html=[];

  // Nút ăn — luôn hiện đầu tiên
  let eatCls='an';
  if(eatDone) eatCls+=' eaten';
  if(eatDone || done) eatCls+=' dis';
  const eatCanDo=!eatDone && !done;
  const eatM=eat.m;
  const canAfford=S.money >= -eatM;
  if(!canAfford) eatCls+=' dis';
  const eatEff=`${eatM} tệ · +${eat.hp}HP +${eat.sp}SP`;
  html.push(`<button class="act ${eatCls}" data-a="eat" data-k="${eat.k}" ${(eatCanDo&&canAfford)?'':'disabled'}>
    <b>${eat.e}</b><span>${eat.n}</span><small>${eatDone?'Đã ăn':eatM}</small>
  </button>`);

  // Các hành động khác
  for(let i=0;i<list.length;i++){
    const a=list[i];
    const clsMap={hoc:'hoc',lam:'lam',viet:'viet',choi:'choi',ngu:'sleep'};
    let cls=clsMap[a.grp]||'';
    let dis=false;
    if(!eatDone && !done) dis=true;  // phải ăn trước
    if(done) dis=true;
    if(a.k=='c_wr' && (S.hp<30||S.sp<30)) dis=true;
    if(a.m<0 && S.money<-a.m) dis=true;
    if(a.k=='c_wr' && S.lu>=100) dis=true;
    if(dis) cls+=' dis';
    let eff='';
    if(a.m) eff=(a.m>0?'+':'')+a.m;
    else if(a.kt) eff='+'+a.kt+'KT';
    else if(a.lu) eff='+'+a.lu+'%';
    else if(a.hp&&a.sp) eff=`${a.hp}HP ${a.sp}SP`;
    html.push(`<button class="act ${cls}" data-a="do" data-k="${a.k}" ${dis?'disabled':''}>
      <b>${a.e}</b><span>${a.n}</span>${eff?`<small>${eff}</small>`:''}
    </button>`);
  }
  const actsEl=$('#acts');
  const h=html.join('');
  if(actsEl._h!==h){actsEl._h=h;actsEl.innerHTML=h}

  // next button
  const nb=$('#nextBtn');
  if(period==2) nb.textContent='🌙 KẾT THÚC NGÀY';
  else nb.textContent='➡️ SANG BUỔI '+['CHIỀU','TỐI'][period];
  nb.disabled=!done;
}
function drawAll(){drawHead();drawScene();drawActs()}

function addLog(s){
  S.logDay.push(s);
  if(S.logDay.length>60) S.logDay.shift();
  S.logAll.push({d:S.day,s:s});
  if(S.logAll.length>500) S.logAll.shift();
}

function lowEff(){return (S.hp<30||S.sp<30)?0.5:1}

/* Ăn */
function doEat(k){
  if(T.modal) return;
  if(S.ateInPeriod || S.actedInPeriod) return toast('Buổi này đã ăn rồi');
  const eat=EAT_LABELS[S.period];
  if(S.money<-eat.m) return toast('Không đủ tiền ăn');
  S.money+=eat.m;
  S.hp=cl(S.hp+eat.hp,0,100);
  S.sp=cl(S.sp+eat.sp,0,100);
  S.ateInPeriod=true;
  addLog(`${eat.e} ${eat.n}: +${eat.hp}HP +${eat.sp}SP`);
  beep(520,.08);
  save();drawAll();
}

/* Hành động khác */
function doAct(k){
  if(T.modal) return;
  if(S.actedInPeriod) return toast('Buổi này đã làm rồi');
  if(!S.ateInPeriod) return toast('Phải ăn trước đã');
  const a=ACTS.find(x=>x.k==k);
  if(!a) return;
  if(a.k=='c_wr' && (S.hp<30||S.sp<30)) return toast('Cần HP, SP ≥ 30');
  if(a.m<0 && S.money<-a.m) return toast('Không đủ tiền');
  if(a.k=='c_wr' && S.lu>=100) return;

  const eff=lowEff();
  if(a.hp) S.hp=cl(S.hp+Math.round(a.hp*eff),0,100);
  if(a.sp) S.sp=cl(S.sp+Math.round(a.sp*eff),0,100);
  if(a.m) S.money+=a.m;
  if(a.kt){
    const g=Math.round(a.kt*eff);
    S.kt+=g;
    addLog(`${a.e} ${a.n}: +${g} KT`);
  } else if(a.lu){
    let g=a.lu;
    if(a.lu==1){
      const rate=WRITE_RATE[S.ch];
      g=rate*(1+S.kt/100)*eff;
    }
    g=Math.round(g*10)/10;
    S.lu=cl(S.lu+g,0,100);
    addLog(`${a.e} ${a.n}: +${g}% luận văn`);
  } else if(a.grp=='lam'){
    addLog(`${a.e} ${a.n}: +${a.m} tệ`);
  } else {
    addLog(`${a.e} ${a.n}`);
  }
  S.actedInPeriod=true;
  beep(a.grp=='viet'?880:a.grp=='choi'?660:520,.08);

  // HP thấp → nghỉ ốm
  if(S.hp<20 && S.hp>0){
    save();drawAll();
    setTimeout(()=>{
      modal(`<h2>🤒 Vân Khánh ốm</h2>
      <div class="body">HP xuống dưới 20. Cô phải nghỉ ngơi một ngày.</div>
      <div class="mb"><button class="btn p" data-a="mx">Cố lên.</button></div>`);
      S.hp=50;S.sp=Math.max(30,S.sp);
      S.day++;S.period=0;S.actedInPeriod=false;S.ateInPeriod=false;S.logDay=[];
      checkWeekLimit();
      save();drawAll();
    },400);
    return;
  }
  if(S.hp<=0) S.hp=30;
  save();drawAll();
}

/* chuyển buổi */
function nextPeriod(){
  if(!S.actedInPeriod) return;
  if(S.period>=2){
    // tối → hết ngày
    endDay(false);
    return;
  }
  S.period++;
  S.ateInPeriod=false;
  S.actedInPeriod=false;
  save();drawAll();
}

/* nút Ngủ FAB */
function sleepNow(){
  if(T.modal) return;
  const cleanDay = S.period==0 && !S.ateInPeriod && !S.actedInPeriod;
  if(!cleanDay){
    if(!confirm('Kết thúc ngày sớm?\nSẽ bỏ qua các buổi còn lại.')) return;
  }
  S.hp=cl(S.hp+18,0,100);
  S.sp=cl(S.sp+35,0,100);

}

/* hết ngày */
function endDay(fromSleep){
  // Chủ Nhật → tổng kết tuần
  if(S.day%7==0){
    endWeek();
    return;
  }
  S.day++;
  S.period=0;
  S.actedInPeriod=false;
  S.ateInPeriod=false;
  S.logDay=[];
  S.hp=cl(S.hp+2,0,100);
  S.sp=cl(S.sp+2,0,100);
  checkWeekLimit();
  checkStory();
  save();drawAll();
}

/* vượt max tuần → thua */
function checkWeekLimit(){
  if(S.week>MAX_WEEKS[S.ch]){
    S.endReason='timeout';
    save();
    modal(`<h2>⏰ Quá hạn</h2>
    <div class="body">Vân Khánh đã học quá ${MAX_WEEKS[S.ch]} tuần mà chưa bảo vệ được luận văn. Trường buộc cô thôi học.</div>
    <div class="ev">Cô ngồi trong phòng trọ, nhìn cuốn nhật ký dở dang.</div>
    <div class="mb2">
      <button class="btn" data-a="record">🏆 Kỷ lục</button>
      <button class="btn p" data-a="restart">🔄 Chơi lại</button>
    </div>`);
  }
}

/* tổng kết tuần */
function endWeek(){
  const scholar=SCHOLAR[S.ch];
  const before=S.money;
  S.money+=scholar;
  S.money-=RENT;
  const wLog={week:S.week,ch:S.ch,moneyBefore:before,moneyAfter:S.money,
    scholar,rent:RENT,lu:S.lu,kt:S.kt,hp:S.hp,sp:S.sp};
  S.logWeek.push(wLog);
  if(S.logWeek.length>40) S.logWeek.shift();

  S.week++;
  S.day++;
  S.period=0;
  S.actedInPeriod=false;
  S.ateInPeriod=false;
  S.logDay=[];
  save();

  const delta=S.money-before;
  const weeksLeft=MAX_WEEKS[S.ch]-S.week+1;
  modal(`<div class="sp"><img src="icon-192.png" alt=""></div>
  <h2>🌙 TỔNG KẾT TUẦN ${S.week-1}</h2>
  <div class="g2">
    <span>🎁 Học bổng</span><b>+${scholar} tệ</b>
    <span>🏠 Tiền nhà</span><b>−${RENT} tệ</b>
    <span>💰 Chênh lệch</span><b style="color:${delta>=0?'#3a8a70':'#c92e72'}">${delta>=0?'+':''}${delta} tệ</b>
    <span>💵 Còn lại</span><b>${F(S.money)} tệ</b>
    <span>📝 Luận văn</span><b>${S.lu.toFixed(1)}%</b>
    <span>⏳ Còn lại</span><b>${weeksLeft} tuần</b>
  </div>
  ${S.money<0?'<div class="ev" style="color:#c92e72"><b>⚠️ Tiền âm!</b></div>':''}
  <div class="mb"><button class="btn p" data-a="mx">Sang tuần ${S.week} 💕</button></div>`);
  if(S.money<0){
    S.endReason='evicted';
    setTimeout(()=>{
      modal(`<h2>💸 Hết tiền</h2>
      <div class="body">Vân Khánh không trả nổi tiền nhà. Chủ nhà đuổi cô ra khỏi phòng.</div>
      <div class="ev">Cô ngồi trước cổng trường, kéo vali, không biết đi đâu.</div>
      <div class="mb2">
        <button class="btn" data-a="record">🏆 Kỷ lục</button>
        <button class="btn p" data-a="restart">🔄 Chơi lại</button>
      </div>`);
    },300);
    return;
  }
  checkWeekLimit();
  if(S.endReason) return;
  checkStory();
  drawAll();
}

/* STORY */
function checkStory(){
  if(S.lu>=100 && S.ch==1){
    const ch1Days=S.day, ch1Weeks=S.week;
    S.ch=2;S.lu=0;S.day=1;S.week=1;S.period=0;
    S.actedInPeriod=false;S.ateInPeriod=false;S.logDay=[];
    S.hp=Math.max(S.hp,70);S.sp=Math.max(S.sp,70);
    S.money=Math.max(S.money,2000);
    window.__ch1Days=ch1Days;window.__ch1Weeks=ch1Weeks;
    save();
    modal(`<div class="sp"><img src="icon-192.png" alt=""></div>
    <h2>🎓 Hoàn thành thạc sĩ!</h2>

    <div class="ev">Chương 1 mất <b>${ch1Days} ngày</b> (${ch1Weeks} tuần).</div>
    <div class="mb"><button class="btn p" data-a="mx">Lên đường! 🚄</button></div>`);
    drawAll();
    return;
  }
  if(S.lu>=100 && S.ch==2){finishGrad();return}

  if(S.ch==1){
    if(S.day==1 && !S.flags){S.flags={i1:1};
      modal(`<h2>🌸 Ngày đầu ở Bắc Kinh</h2><div class="body">Vân Khánh xuống sân bay, kéo vali đến CNU. Trời thu Bắc Kinh se lạnh.</div><div class="ev"><i>"Ngày 1 — con bắt đầu."</i></div><div class="mb"><button class="btn p" data-a="mx">Ừm.</button></div>`)}
  }
  if(S.ch==2){
    if(S.day==1 && (!S.flags||!S.flags.i2)){S.flags=Object.assign({},S.flags,{i2:1});
      modal(`<h2>🚄 Lên Thượng Hải</h2><div class="body">Vân Khánh chuyển lên Thượng Hải, nhập học SISU.</div><div class="mb"><button class="btn p" data-a="mx">Bắt đầu.</button></div>`)}
  }
}

/* EVENT */
function startEvent(city,cost,kt,lu,sp,daysAhead){
  S.event={city,cost,kt,lu,sp,triggerDay:S.day+daysAhead};
  save();
  toast(`📢 Hội thảo ${city}! Cần ${cost} tệ · ${daysAhead} ngày nữa`);
}
function eventGo(){
  if(!S.event) return;
  if(S.money<S.event.cost){ toast('❌ Không đủ tiền!'); return; }
  if(!confirm(`Đi hội thảo ${S.event.city}?\nTốn ${S.event.cost} tệ.`)) return;
  const e=S.event;
  S.money-=e.cost;
  S.kt+=e.kt;
  S.lu=cl(S.lu+e.lu,0,100);
  S.sp=cl(S.sp+e.sp,0,100);
  addLog(`🌏 Hội thảo ${e.city}: −${e.cost} tệ`);
  S.event=null;
  beep(990,.3);
  toast(`✅ Đã đi hội thảo ${e.city}!`);
  save();drawAll();
}
function eventNo(){
  if(!S.event) return;
  if(!confirm('Không đi hội thảo này?')) return;
  S.sp=cl(S.sp-5,0,100);
  addLog(`😔 Bỏ lỡ hội thảo ${S.event.city}`);
  S.event=null;
  save();drawAll();
}

/* FINISH */
function finishGrad(){
  if(S.endReason=='grad') return;
  S.endReason='grad';
  const total=S.day;
  const ch1=window.__ch1Days||total;
  const ch2=Math.max(0,total-ch1);
  addFinish(total,ch1,ch2);
  save();
  beep(1200,.5);
  modal(`<div class="sp"><img src="icon-192.png" alt=""></div>
  <h2>🎓 Lễ tốt nghiệp</h2>
  <div class="body">
  Vân Khánh bảo vệ luận án tiến sĩ tại SISU Thượng Hải thành công.
  <br><br>
  <b>Bố, mẹ và em gái từ Việt Nam bay sang dự lễ.</b> Mẹ mặc áo dài, khóc. Bố im lặng nhưng mắt đỏ. Em gái chụp ảnh lia lịa.
  <br><br>
  Giáo sư Lý gật đầu: <i>"Cô xứng đáng."</i>
  </div>
  <div class="ev">
  <i>"Ngày ấy con hứa với mẹ — con làm được rồi."</i>
  </div>
  <div class="g2" style="margin-top:10px">
    <span>Tổng số ngày</span><b>${total}</b>
    <span>Chương 1</span><b>${ch1} ngày</b>
    <span>Chương 2</span><b>${ch2} ngày</b>
  </div>
  <div class="mb2">
    <button class="btn" data-a="record">🏆 Kỷ lục</button>
    <button class="btn p" data-a="restart">🔄 Chơi lại</button>
  </div>`);
}
function finishHome(){
  if(!confirm('Vân Khánh gấp cuốn nhật ký, đặt bút xuống?\n\nKết thúc sớm — không tính kỷ lục.')) return;
  if(!confirm('Chắc chắn chứ?')) return;
  S.endReason='home';
  save();
  modal(`<div class="sp"><img src="icon-192.png" alt=""></div>
  <h2>🏠 Về nhà</h2>
  <div class="body">
  Vân Khánh gấp cuốn nhật ký, đặt bút xuống. Cô đặt vé máy bay về Việt Nam.
  <br><br>
  Có những giấc mơ không cần hoàn thành — chỉ cần mình biết mình đã cố gắng.
  </div>
  <div class="ev"><i>— HẾT —</i></div>
  <div class="mb2">
    <button class="btn" data-a="record">🏆 Kỷ lục</button>
    <button class="btn p" data-a="restart">🔄 Chơi lại</button>
  </div>`);
}

/* SHEETS */
function openLog(){
  T.sheet='log';
  setTxt('sht','📖 Nhật ký');
  let html='';
  if(S.logWeek.length){
    html='<h3>Log tuần</h3>'+S.logWeek.slice().reverse().map(w=>`
      <div class="it"><div class="m"><b>Tuần ${w.week}</b>
      <small>HB +${w.scholar} · Nhà −${w.rent} · Còn ${F(w.moneyAfter)} tệ</small>
      <small>Luận văn ${w.lu.toFixed(1)}% · KT ${Math.round(w.kt)}</small>
      </div></div>`).join('');
  }
  const arr=S.logAll.slice(-60).reverse();
  if(arr.length){
    html+='<h3>Gần đây</h3>'+arr.map(x=>`<div class="it"><div class="m"><b>Ngày ${x.d}</b><small>${x.s}</small></div></div>`).join('');
  } else if(!html) html='<div class="sm mu">Chưa có gì.</div>';
  $('#shb').innerHTML=html;
  $('#sheet').classList.remove('hide');
}
function openRecord(){
  T.sheet='record';
  setTxt('sht','🏆 Kỷ lục');
  const r=getRec();
  const fin=(r.fin||[]).slice().reverse().slice(0,5);
  $('#shb').innerHTML=`
    <div class="ev"><b>Kỷ lục tốt nhất</b>
    <div class="g2" style="margin-top:6px">
      <span>🥇 Chương 1</span><b>${r.b1?r.b1+' ngày':'—'}</b>
      <span>🥇 Chương 2</span><b>${r.b2?r.b2+' ngày':'—'}</b>
      <span>🥇 Tổng</span><b>${r.bT?r.bT+' ngày':'—'}</b>
    </div></div>
    <h3>Lần gần đây</h3>
    ${fin.length? fin.map(f=>`<div class="it"><div class="m"><b>Tổng ${f.t} ngày</b><small>C1: ${f.c1} · C2: ${f.c2}</small></div></div>`).join('') : '<div class="sm mu">Chưa hoàn thành.</div>'}
    <h3>💾 Save</h3>
    <div class="bs" style="margin-bottom:8px">
      <button class="b2 p" data-a="save">💾 Lưu</button>
      <button class="b2 ${hasSlot()?'g':''}" data-a="load" ${hasSlot()?'':'disabled'}>📂 Tải</button>
      <button class="b2" data-a="export">⬇️ Xuất</button>
      <button class="b2" data-a="import">⬆️ Nhập</button>
    </div>
    <div class="bs" style="margin-top:8px">
      <button class="b2" data-a="snd">🔊 ${S.snd?'Bật':'Tắt'}</button>
      <button class="b2" data-a="help">❓ Hướng dẫn</button>
      <button class="b2" data-a="wipeslot">🗑️ Xoá save</button>
      <button class="b2" data-a="restart">💥 Chơi lại</button>
    </div>`;
  $('#sheet').classList.remove('hide');
}
function reSheet(){if(T.sheet){if(T.sheet=='log')openLog();else if(T.sheet=='record')openRecord()}}

/* TEXT */
const INTRO=`<div class="sp"><img src="icon-192.png" alt=""></div>
<h2>🌸 Vân Khánh Diary</h2>
<div class="body">
Vân Khánh 22 tuổi, du học sinh Việt Nam tại <b>CNU Bắc Kinh</b>. Học bổng chỉ trả học phí — cô tự lo tiền nhà, tiền ăn và luận văn.
<br><br>
🌸 <b>Mục tiêu:</b> Xong thạc sĩ (max 36 tuần) → chuyển lên <b>SISU Thượng Hải</b> → xong tiến sĩ (max 72 tuần) → tốt nghiệp.
<br><br>
Bố mẹ và em gái sẽ bay sang dự lễ. Mẹ đã hứa.
</div>
<div class="mb"><button class="btn p" data-a="mx">Bắt đầu 💕</button></div>`;

const HELP=`<h2>🌸 Cách chơi</h2>
<div class="body">
1 ngày = <b>3 buổi</b>. Mỗi buổi: <b>ăn mặc định trước</b>, sau đó chọn 1 hành động.
<br><br>
Bấm hành động → bấm <b>➡️ SANG BUỔI</b> để chuyển.
<br><br>
Bấm <b>🌙 (góc phải)</b> để ngủ bất cứ lúc nào — có xác nhận nếu chưa hết ngày.
<br><br>
<b>Chỉ số:</b> HP &lt; 20 → nghỉ ốm · SP &lt; 20 → yếu 50% · KT cao → viết nhanh · Luận văn 100% → tốt nghiệp.
<br><br>
<b>Hạn:</b> Thạc sĩ 36 tuần · Tiến sĩ 72 tuần. Quá hạn → thua.
<br><br>
<b>Tuần:</b> −1000 tệ nhà. Học bổng: +2500 (Thạc sĩ) · +3500 (Tiến sĩ).
</div>
<div class="mb"><button class="btn p" data-a="mx">OK! 🌸</button></div>`;

/* EVENTS */
document.addEventListener('click',e=>{
  const target=e.target.closest('[data-a]');
  if(!target) return;
  const a=target.dataset.a,k=target.dataset.k;
  switch(a){
    case 'eat':doEat(k);break;
    case 'do':doAct(k);break;
    case 'next':nextPeriod();break;
    case 'sleep':sleepNow();break;
    case 'log':openLog();break;
    case 'record':openRecord();break;
    case 'home':finishHome();break;
    case 'closeSheet':closeSheet();break;
    case 'mx':mclose();break;
    case 'help':closeSheet();modal(HELP);break;
    case 'save':manualSave();reSheet();break;
    case 'load':manualLoad();break;
    case 'export':exportSave();break;
    case 'import':importSave();break;
    case 'snd':S.snd^=1;save();reSheet();break;
    case 'wipeslot':
      if(!hasSlot()) return toast('📭 Chưa có save');
      if(confirm('Xoá save thủ công?')){deleteSlot();toast('🗑️ Đã xoá');reSheet()}
      break;
    case 'restart':
      if(!confirm('Chơi lại từ đầu?')) return;
      localStorage.removeItem(KEY);
      location.reload();
      break;
    case 'evGo':eventGo();break;
    case 'evNo':eventNo();break;
  }
});
const sheetEl=$('#sheet');
if(sheetEl) sheetEl.addEventListener('click',e=>{
  if(e.target.id==='sheet') closeSheet();
});

/* KICKOFF */
window.__ch1Days=null;
window.__ch1Weeks=null;
if(!S.flags) S.flags={};
drawAll();
if(!S.seen){ S.seen=1;save(); modal(INTRO); }
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
